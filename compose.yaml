services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clientdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - clientdesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clientdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  clientdesk_data:
